name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      force:
        description: Force a bump level for this run
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      prerelease:
        description: Publish a prerelease instead of a stable release
        required: false
        default: false
        type: boolean
      prerelease_token:
        description: Prerelease token to use when prerelease is enabled
        required: false
        default: beta
        type: choice
        options:
          - beta
      noop:
        description: Dry run only; do not push tags, releases, or packages
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.semantic-release.outputs.released || 'false' }}
      tag: ${{ steps.semantic-release.outputs.tag }}
      version: ${{ steps.semantic-release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Force branch to workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Semantic release
        id: semantic-release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com
          build: false
          force: ${{ github.event_name == 'workflow_dispatch' && inputs.force != 'auto' && inputs.force || '' }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && 'true' || 'false' }}
          prerelease_token: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease_token || 'beta' }}
          no_operation_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.noop && 'true' || 'false' }}

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/ezmig

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Upload distributions to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  binary:
    name: Build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ezmig-linux-amd64
          - os: macos-latest
            artifact: ezmig-macos-aarch64
          - os: windows-latest
            artifact: ezmig-windows-amd64.exe

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build binary
        run: uv run pyinstaller --onefile --name ezmig src/ezmig/__main__.py

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: mv dist/ezmig dist/${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item dist\ezmig.exe ${{ matrix.artifact }}
        shell: pwsh

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/${{ matrix.artifact }}
